name: Keep Supabase Alive

on:
  schedule:
    # Runs every 5 days at 8:00 AM UTC to prevent Supabase free-tier pausing (7-day inactivity limit)
    - cron: '0 8 */5 * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase to prevent pausing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "Pinging Supabase at $(date -u)"

          # Simple REST query against the receipts table (limit 1 row) using the PostgREST API
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/receipts?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}")

          echo "Supabase responded with HTTP status: ${HTTP_STATUS}"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "SUCCESS - Supabase is alive and responding"
          else
            echo "WARNING - Unexpected status code: ${HTTP_STATUS}"
            exit 1
          fi
